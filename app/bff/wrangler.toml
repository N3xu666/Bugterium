# Bugterium BFF — Cloudflare Worker (Static Assets + API)
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "bugterium-bff"
main = "src/index.ts"
compatibility_date = "2026-11-04"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]

[vars]
ENVIRONMENT = "development"
COOKIE_NAME = "bugterium_session"
# Укажи здесь свой GitHub ID (число) через запятую, чтобы стать админом. 
# Узнать ID можно тут: https://api.github.com/users/ТВОЙ_НИКНЕЙМ
ADMIN_GITHUB_IDS = "192156933" 

[[d1_databases]]
binding = "DB"
database_name = "bugterium-db"
database_id = "c4510ea0-edeb-49a2-85c3-52989c46539c"

[triggers]
crons = ["0 3 * * *"]
