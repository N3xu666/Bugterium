name = "bugterium-security-monitor"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
SITE_HOST = "bugterium.pages.dev"
MONITOR_HOST = "bugterium-security-monitor.bugterium.workers.dev"
BFF_HOST = "bugterium-bff.bugterium.workers.dev"

[observability]
enabled = true
head_sampling_rate = 0.1
[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "MONITOR_KV"
id = "3ac6d1fc35394cf48c9a621f653efed7"

[[d1_databases]]
binding = "DB"
database_name = "bugterium-db"
database_id = "c4510ea0-edeb-49a2-85c3-52989c46539c"
