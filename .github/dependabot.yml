version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/app/bff"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/app/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/site"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/app/security-monitor"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    cooldown:
      default-days: 7
    directory: "/tools/python"
    schedule:
      interval: "weekly"