name: Update Live Threats

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Fetch CVEs (NVD + KEV + EPSS)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python site/scripts/fetch-cves.py

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore(site): auto-update live threats feed"
          title: "Auto-update Live Threats Feed"
          body: "Automated CVE feed update. Please review and merge."
          branch: auto-update-feed
          delete-branch: true

      - name: Enable Auto-Merge for Feed Only
        if: steps.cpr.outputs.pull-request-number && steps.cpr.outputs.pull-request-branch == 'auto-update-feed'
        run: |
          echo "Arming auto-merge strictly for Feed PR #${{ steps.cpr.outputs.pull-request-number }} on branch ${{ steps.cpr.outputs.pull-request-branch }}..."
          gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
