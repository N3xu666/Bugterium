name: Deploy App

on:
  workflow_run:
    workflows: ["App CI"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            app/bff/package-lock.json
            app/frontend/package-lock.json
      - name: Install BFF deps
        working-directory: app/bff
        run: npm ci
      - name: Build frontend
        working-directory: app/frontend
        run: npm ci && npm run build
      - name: Deploy Security Monitor
        id: deploy-monitor
        working-directory: app/security-monitor
        run: |
          set -euo pipefail
          OUTPUT=$(npx wrangler@4.155.0 deploy --minify 2>&1) || { echo "$OUTPUT"; exit 1; }
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n1)
          if [ -z "$URL" ]; then
            echo "::error::Could not parse Worker URL from deploy output"
            exit 1
          fi
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test Security Monitor (/healthz x3)
        run: |
          set -euo pipefail
          URL="${{ steps.deploy-monitor.outputs.worker_url }}"
          if [ -z "$URL" ]; then echo "::error::worker_url output missing"; exit 1; fi
          for i in 1 2 3; do
            if curl -fsS --max-time 10 "$URL/healthz" > /dev/null; then
              echo "healthz OK (attempt $i)"
              exit 0
            fi
            echo "healthz attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "::error::healthz failed after 3 attempts"
          exit 1
      - name: Rollback Security Monitor on smoke failure
        if: failure() && steps.deploy-monitor.outputs.worker_url != ''
        working-directory: app/security-monitor
        run: npx wrangler@4.155.0 rollback -y --message "smoke test failed (Pass 192 0b.5)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        id: deploy-bff
        working-directory: app/bff
        run: |
          set -euo pipefail
          OUTPUT=$(npx wrangler@4.155.0 deploy --minify 2>&1) || { echo "$OUTPUT"; exit 1; }
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n1)
          if [ -z "$URL" ]; then
            echo "::error::Could not parse Worker URL from deploy output"
            exit 1
          fi
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test BFF (/api/health + security headers)
        run: |
          set -euo pipefail
          URL="${{ steps.deploy-bff.outputs.worker_url }}"
          if [ -z "$URL" ]; then echo "::error::worker_url output missing"; exit 1; fi
          # Health endpoint with 3 retries
          for i in 1 2 3; do
            if curl -fsS --max-time 10 "$URL/api/health" > /dev/null; then
              echo "BFF health OK (attempt $i)"
              break
            fi
            if [ "$i" = "3" ]; then echo "::error::BFF health failed after 3 attempts"; exit 1; fi
            echo "BFF health attempt $i failed, retrying in 5s..."
            sleep 5
          done
          # Header assertions
          HEADERS=$(curl -sI --max-time 10 "$URL/api/health")
          FAIL=0
          for H in \
            "x-content-type-options: nosniff" \
            "referrer-policy: strict-origin-when-cross-origin" \
            "cache-control: no-store" \
            "content-security-policy:" \
            "strict-transport-security:"; do
            if ! echo "$HEADERS" | grep -qiF "$H"; then
              echo "::error::Missing or wrong header: $H"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "BFF headers OK"
      - name: Rollback BFF on smoke failure
        if: failure() && steps.deploy-bff.outputs.worker_url != ''
        working-directory: app/bff
        run: npx wrangler@4.155.0 rollback -y --message "smoke test failed (Pass 192 0b.5)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}